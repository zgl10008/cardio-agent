<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1510" viewBox="0 0 1400 1510" role="img" aria-labelledby="title desc">
<title id="title">基于多模式 Agent 与 RAG 的智能问答平台：系统架构</title>
<desc id="desc">四层架构：应用接入、Agent 编排、检索与记忆、模型与数据。健康咨询与健康文档是现有两个界面。绿色箭头表示主处理流程，金色虚线表示失败重规划。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#238979"/></marker><marker id="retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B48B43"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#26364C}.layer{fill:#F4F7FB;stroke:#B8CCD5;stroke-width:2}.core{fill:#EEF8F5;stroke:#B8CCD5;stroke-width:2}.card{fill:white;stroke:#B8CCD5;stroke-width:2}.heading{font-size:30px;font-weight:700}.name{font-size:25px;font-weight:700}.body{font-size:21px}.note{font-size:19px;fill:#536F7C}.flow{fill:none;stroke:#238979;stroke-width:2.4;marker-end:url(#arrow)}.retry{fill:none;stroke:#B48B43;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#retry)}</style>
<rect width="1400" height="1510" fill="white"/>
<rect x="16" y="20" width="1368" height="220" rx="12" class="layer"/>
<text x="40" y="65" class="heading">01 应用接入层</text>
<rect x="48" y="92" width="416" height="118" rx="12" class="card"/>
<text x="68" y="131" class="name">健康咨询</text>
<text x="68" y="168" class="body">多轮问答 · 引用与执行状态</text>
<rect x="492" y="92" width="416" height="118" rx="12" class="card"/>
<text x="512" y="131" class="name">健康文档</text>
<text x="512" y="168" class="body">文档上传 · 列表与处理状态</text>
<rect x="936" y="92" width="416" height="118" rx="12" class="card"/>
<text x="956" y="131" class="name">FastAPI 服务</text>
<text x="956" y="168" class="body">对话接口 · 文档入库接口</text>
<path d="M700 240 V270" class="flow"/>
<rect x="16" y="272" width="1368" height="574" rx="12" class="core"/>
<text x="40" y="319" class="heading">02 Agent 编排层</text>
<text x="930" y="317" class="note">通用流程 + 可插拔领域策略</text>
<rect x="48" y="350" width="416" height="132" rx="12" class="card"/>
<text x="68" y="389" class="name">① 输入与任务路由</text>
<text x="68" y="426" class="body">风险识别 · 规则快路径</text>
<text x="68" y="459" class="body">LLM 意图识别 · 兜底处理</text>
<rect x="492" y="350" width="416" height="132" rx="12" class="card"/>
<text x="512" y="389" class="name">② 上下文组装</text>
<text x="512" y="426" class="body">近期对话 · 历史语义召回</text>
<text x="512" y="459" class="body">滑动窗口 · 摘要压缩</text>
<rect x="936" y="350" width="416" height="132" rx="12" class="card"/>
<text x="956" y="389" class="name">③ 任务执行</text>
<text x="956" y="426" class="body">ReAct / Plan-and-Execute</text>
<text x="956" y="459" class="body">任务拆解 · 分步执行</text>
<path d="M464 416 H490" class="flow"/>
<path d="M908 416 H934" class="flow"/>
<path d="M1144 482 V562" class="flow"/>
<rect x="936" y="565" width="416" height="132" rx="12" class="card"/>
<text x="956" y="604" class="name">④ 工具调用</text>
<text x="956" y="641" class="body">Function Calling</text>
<text x="956" y="674" class="body">知识检索 · 计算 · 搜索</text>
<rect x="492" y="565" width="416" height="132" rx="12" class="card"/>
<text x="512" y="604" class="name">⑤ 回答检查与修正</text>
<text x="512" y="641" class="body">证据支持 · 质量评估</text>
<text x="512" y="674" class="body">按需触发 · 受限修正</text>
<rect x="48" y="565" width="416" height="132" rx="12" class="card"/>
<text x="68" y="604" class="name">⑥ 结果返回与记忆回写</text>
<text x="68" y="641" class="body">回答 · 引用 · 执行状态</text>
<text x="68" y="674" class="body">会话保存 · 记忆更新</text>
<path d="M936 631 H910" class="flow"/>
<path d="M492 631 H466" class="flow"/>
<path d="M1260 565 V526 H1320 V484" class="retry"/>
<text x="935" y="532" class="note">失败时受限重规划</text>
<text x="48" y="754" class="body">主流程按 ① → ⑥ 执行；命中风险策略或证据不足时，可提前结束。</text>
<text x="48" y="798" class="note">绿色实线：主处理流程     金色虚线：失败重规划     下层模块：按需调用与读写</text>
<path d="M700 846 V876" class="flow"/>
<rect x="16" y="878" width="1368" height="316" rx="12" class="layer"/>
<text x="40" y="925" class="heading">03 检索与记忆支撑层</text>
<rect x="48" y="952" width="636" height="209" rx="12" class="card"/>
<text x="68" y="991" class="name">RAG 知识检索</text>
<text x="68" y="1028" class="body">文档解析 → 分块 → 索引构建</text>
<text x="68" y="1061" class="body">BM25 + BGE-M3 → RRF → 精排</text>
<text x="68" y="1094" class="body">证据门控 · 知识片段与引用</text>
<rect x="716" y="952" width="636" height="209" rx="12" class="card"/>
<text x="736" y="991" class="name">分层记忆管理</text>
<text x="736" y="1028" class="body">Redis：近期对话与短期缓存</text>
<text x="736" y="1061" class="body">Milvus：历史信息语义召回</text>
<text x="736" y="1094" class="body">PostgreSQL：会话持久化与恢复</text>
<path d="M700 1194 V1224" class="flow"/>
<rect x="16" y="1226" width="1368" height="234" rx="12" class="layer"/>
<text x="40" y="1273" class="heading">04 模型与数据底座</text>
<rect x="48" y="1300" width="306" height="128" rx="12" class="card"/>
<text x="68" y="1339" class="name">大模型服务</text>
<text x="68" y="1376" class="body">OpenAI 兼容接口</text>
<text x="68" y="1409" class="body">模型调用 · 熔断处理</text>
<rect x="380" y="1300" width="306" height="128" rx="12" class="card"/>
<text x="400" y="1339" class="name">检索模型</text>
<text x="400" y="1376" class="body">BGE-M3</text>
<text x="400" y="1409" class="body">BGE-Reranker-v2-M3</text>
<rect x="712" y="1300" width="306" height="128" rx="12" class="card"/>
<text x="732" y="1339" class="name">会话与缓存</text>
<text x="732" y="1376" class="body">PostgreSQL</text>
<text x="732" y="1409" class="body">Redis</text>
<rect x="1044" y="1300" width="308" height="128" rx="12" class="card"/>
<text x="1064" y="1339" class="name">向量存储</text>
<text x="1064" y="1376" class="body">Milvus Lite</text>
<text x="1064" y="1409" class="body">文档与记忆向量</text>
